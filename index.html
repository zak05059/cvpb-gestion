<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CVPB Gestion</title>
<meta name="description" content="Application de gestion de la Communauté Virtuelle de Port-Bouët : encaissements, caisse, suivi des étudiants et rapports de tutorat.">
<meta name="theme-color" content="#5a0763">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CVPB">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Charte CVPB : violet du livre + vert de l'anneau, fond blanc légèrement lilas. Barre d'en-tête violette, navigation en onglets défilants, contenu en cartes. */
  --bg:#faf7fb; --surface:#ffffff; --ink:#24152a; --muted:#6c5d72; --line:#e8dfeb;
  --violet:#7a0a86; --violet-ink:#ffffff; --violet-soft:#f4e7f6;
  --vert:#2e9b3f; --vert-soft:#e3f3e6;
  --ok:#2e9b3f; --ok-soft:#e3f3e6; --warn:#a86a0c; --warn-soft:#fbf0dc; --bad:#c2372f; --bad-soft:#fbe5e3; --info:#7a0a86; --info-soft:#f4e7f6;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#140d17; --surface:#1f1625; --ink:#f2ebf4; --muted:#ab9db1; --line:#382a40;
    --violet:#d38ce0; --violet-ink:#1e0723; --violet-soft:#3a1f42; --vert:#6fd27f; --vert-soft:#173a1f;
    --ok:#6fd27f; --ok-soft:#173a1f; --warn:#e8b25a; --warn-soft:#3b2c12; --bad:#f2786f; --bad-soft:#401b19; --info:#d38ce0; --info-soft:#3a1f42;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#140d17; --surface:#1f1625; --ink:#f2ebf4; --muted:#ab9db1; --line:#382a40;
  --violet:#d38ce0; --violet-ink:#1e0723; --violet-soft:#3a1f42; --vert:#6fd27f; --vert-soft:#173a1f;
  --ok:#6fd27f; --ok-soft:#173a1f; --warn:#e8b25a; --warn-soft:#3b2c12; --bad:#f2786f; --bad-soft:#401b19; --info:#d38ce0; --info-soft:#3a1f42;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.15;text-wrap:balance}
h1{font-size:1.2rem;font-weight:800}
h2{font-size:1.15rem;font-weight:800}
h3{font-size:1rem;font-weight:600}
p{margin:0}
a{color:var(--violet)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--vert);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.84rem}

body.tut header.top{background:#1f7a2e;border-bottom-color:#6e0a79}
body.tut .bell .badge{background:#6e0a79;border-color:#1f7a2e}
body.tut nav.tabs a[aria-current="page"]{background:var(--vert);color:#fff}
.choix{display:grid;gap:12px;width:100%}
@media (min-width:640px){.choix{grid-template-columns:1fr 1fr}}
.choix button{display:grid;gap:6px;text-align:left;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer}
.choix button:hover{border-color:var(--violet)}
.choix button b{font-family:var(--display);font-size:1.05rem}
fieldset{border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:12px;margin:0;min-width:0}
legend{font-family:var(--display);font-weight:800;padding:0 6px}
.checks{display:grid;gap:6px}
.checks label{display:flex;gap:8px;align-items:flex-start;font-size:.9rem;font-weight:400}
.scale{display:flex;gap:6px;flex-wrap:wrap}
.scale label{display:grid;justify-items:center;gap:2px;border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:.78rem;font-weight:400;min-width:76px}
.scale label:has(input:checked){border-color:var(--vert);background:var(--vert-soft)}
.scale input{margin:0}
.req{color:var(--bad)}
.rep{display:grid;gap:10px}
.rep h4{margin:6px 0 0;font-family:var(--display);font-size:.95rem}
.rep p{white-space:pre-wrap;font-size:.9rem}
header.top{background:#6e0a79;color:#fff;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:4px solid #2e9b3f}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand img{width:44px;height:44px;border-radius:50%;background:#fff;flex:none}
.brand small{display:block;opacity:.85;font-size:.72rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who{display:flex;align-items:center;gap:10px}
.who .id{font-size:.78rem;text-align:right;line-height:1.25}
.who .id b{display:block;font-size:.86rem}
.bell{position:relative;width:40px;height:40px;border-radius:10px;border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;display:grid;place-items:center;cursor:pointer}
.bell svg{width:20px;height:20px}
.bell .badge{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;border-radius:10px;background:#2e9b3f;color:#fff;font-size:.72rem;font-weight:700;display:grid;place-items:center;padding:0 5px;border:2px solid #6e0a79}
nav.tabs{display:flex;gap:4px;overflow-x:auto;background:var(--surface);border-bottom:1px solid var(--line);padding:6px 10px;position:sticky;top:0;z-index:4;scrollbar-width:thin}
nav.tabs a{flex:none;text-decoration:none;color:var(--muted);font-weight:500;font-size:.9rem;padding:8px 12px;border-radius:8px;white-space:nowrap}
nav.tabs a:hover{color:var(--ink);background:var(--violet-soft)}
nav.tabs a[aria-current="page"]{background:var(--violet);color:var(--violet-ink)}
main{max-width:1180px;margin:0 auto;padding:18px 16px 60px;display:grid;gap:16px;align-content:start}

.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:12px;min-width:0;align-content:start}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spread{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:760px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--violet);border-radius:12px;padding:12px 14px;display:grid;gap:2px;min-width:0}
.kpi.g{border-top-color:var(--vert)}
.kpi .v{font-family:var(--display);font-size:1.45rem;font-weight:800;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi .l{font-size:.78rem;color:var(--muted)}
.kpi.bad{border-top-color:var(--bad);background:var(--bad-soft)}
.kpi.warn{border-top-color:var(--warn)}
.cols{display:grid;gap:16px}
@media (min-width:920px){.cols{grid-template-columns:1.25fr 1fr}}
.subtabs{display:flex;gap:6px;flex-wrap:wrap}
.subtabs button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;cursor:pointer;font-size:.88rem}
.subtabs button[aria-pressed="true"]{background:var(--vert);border-color:var(--vert);color:#fff}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 13px;cursor:pointer;font-weight:500;font-size:.88rem;min-height:38px;text-decoration:none;display:inline-flex;align-items:center;gap:6px;color:var(--ink)}
.btn:hover{border-color:var(--violet)}
.btn.primary{background:var(--violet);border-color:var(--violet);color:var(--violet-ink)}
.btn.vert{background:var(--vert);border-color:var(--vert);color:#fff}
.btn.ghost{border-color:transparent;background:transparent;color:var(--violet);padding:6px 8px}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 10px;min-height:32px;font-size:.82rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
input[type=text],input[type=password],input[type=number],input[type=date],input[type=datetime-local],input[type=search],select,textarea{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;min-height:38px;width:100%}
textarea{min-height:76px;resize:vertical}
label.f{display:grid;gap:4px;font-size:.84rem;font-weight:500;min-width:0}
[hidden]{display:none !important}
#rf label.f{display:block}
#rf label.f>input,#rf label.f>select,#rf label.f>textarea{display:block;margin-top:4px}
#rf label.f>.hint{display:block;margin-top:3px}
.form{display:grid;gap:12px}
.g2{display:grid;gap:10px;grid-template-columns:1fr}
@media (min-width:560px){.g2{grid-template-columns:1fr 1fr}}
.filters{display:grid;gap:8px;grid-template-columns:1fr 1fr}
@media (min-width:760px){.filters{grid-template-columns:2fr 1fr 1fr 1fr}}
.hint{font-size:.8rem;color:var(--muted);font-weight:400}

.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.86rem}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600;background:var(--bg);position:sticky;top:0}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--violet-soft)}
tr.annule td{color:var(--muted);text-decoration:line-through}
tr.annule td.keep{text-decoration:none}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:.74rem;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--violet-soft);color:var(--violet);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.mute{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.cell{display:inline-block;min-width:64px;text-align:center;font-size:.76rem;font-weight:600;padding:3px 6px;border-radius:6px}
.cell.ok{background:var(--ok-soft);color:var(--ok)}
.cell.part{background:var(--warn-soft);color:var(--warn)}
.cell.due{background:var(--bad-soft);color:var(--bad)}
.cell.cur{background:var(--violet-soft);color:var(--violet)}
.cell.fut{color:var(--muted)}
.empty{padding:18px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:10px}
.banner{padding:10px 14px;border-radius:10px;font-size:.88rem;border:1px solid var(--warn);background:var(--warn-soft)}
.alerts{display:grid;gap:8px}
.alert{display:grid;grid-template-columns:6px 1fr auto;gap:12px;align-items:center;padding:10px 12px 10px 0;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.alert::before{content:"";align-self:stretch;background:var(--info)}
.alert.bad::before{background:var(--bad)}
.alert.warn::before{background:var(--warn)}
.alert b{display:block;font-size:.9rem}
.alert span{font-size:.82rem;color:var(--muted)}
.feed{display:grid;gap:0}
.feed .it{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.feed .it:last-child{border-bottom:0}
.feed .dot{width:9px;height:9px;border-radius:50%;margin-top:6px;background:var(--line)}
.feed .it.new .dot{background:var(--vert)}
.feed .it.new b{color:var(--ink)}
.bar{height:7px;background:var(--line);border-radius:4px;overflow:hidden;min-width:70px}
.bar i{display:block;height:100%;background:var(--vert)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:5px 10px;cursor:pointer;font-size:.82rem;font-weight:600;min-width:34px}
.seg button[aria-pressed="true"][data-v="P"]{background:var(--ok);color:#fff}
.seg button[aria-pressed="true"][data-v="R"]{background:var(--warn);color:#fff}
.seg button[aria-pressed="true"][data-v="J"]{background:var(--violet);color:#fff}
.seg button[aria-pressed="true"][data-v="A"]{background:var(--bad);color:#fff}
.plist{display:grid;gap:0}
.prow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:.88rem}
.dl dt{color:var(--muted)}
.dl dd{margin:0;font-weight:500}

.overlay{position:fixed;inset:0;background:rgba(20,6,24,.55);display:none;align-items:flex-end;justify-content:center;z-index:20}
.overlay.open{display:flex}
.sheet{background:var(--surface);width:100%;max-width:680px;max-height:92%;overflow:auto;border-radius:16px 16px 0 0;padding:18px;display:grid;gap:14px;align-content:start}
@media (min-width:720px){.overlay{align-items:center}.sheet{border-radius:16px}}
@media (max-width:600px){.brand small,.who .id{display:none}}
table.wrap td{white-space:normal}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:.88rem;z-index:30;display:none;max-width:92%;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.toast.show{display:block}
.gate{max-width:560px;margin:30px auto;display:grid;gap:14px;text-align:center;justify-items:center}
.gate img{width:110px;height:110px;border-radius:50%}
details summary{cursor:pointer;font-weight:600}
@media (prefers-reduced-motion: no-preference){.btn,nav.tabs a{transition:background-color .15s,border-color .15s}}

/* ===================== Design 2026 : interface d'application professionnelle ===================== */
:root{
  --bg:#f5f3f7; --surface:#ffffff; --surface-2:#faf8fb; --ink:#1d1424; --muted:#6b6075; --line:#e9e4ee;
  --violet:#7a0a86; --violet-2:#5a0763; --violet-soft:#f3e8f5; --vert:#2e9b3f; --vert-soft:#e5f4e8;
  --shadow:0 1px 2px rgba(29,20,36,.05),0 4px 16px rgba(29,20,36,.06);
  --shadow-lg:0 12px 40px rgba(29,20,36,.18);
  --r:16px;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#120c15; --surface:#1c1422; --surface-2:#221a29; --line:#33283b; --shadow:0 1px 2px rgba(0,0,0,.3); --violet-2:#b46bc2; } }
body{background:var(--bg);font-size:15px}
header.top{background:linear-gradient(120deg,var(--violet-2) 0%,#7a0a86 55%,#8f1a9b 100%);border-bottom:0;padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top));box-shadow:0 2px 12px rgba(90,7,99,.25);position:relative}
header.top::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,#2e9b3f,#5cc46b 50%,#2e9b3f)}
.brand img{width:40px;height:40px;box-shadow:0 0 0 2px rgba(255,255,255,.6)}
.brand h1{font-size:1.08rem;letter-spacing:-.01em}
.bell{border-radius:12px;background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.22)}
.bell .badge{background:#ff5a4e;border-color:#6e0a79}
.avatar{width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.18);color:#fff;display:grid;place-items:center;font-weight:700;font-size:.85rem;letter-spacing:.02em;flex:none}
nav.tabs{background:rgba(255,255,255,.85);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);padding:8px 14px;gap:6px}
nav.tabs a{border-radius:10px;font-size:.88rem}
nav.tabs a[aria-current="page"]{background:var(--violet);color:#fff;box-shadow:0 2px 8px rgba(122,10,134,.25)}
main{padding:20px 16px 110px;gap:18px}
h2{font-size:1.35rem;letter-spacing:-.015em}
h3{font-size:1.02rem}
.card{border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px}
.kpis{gap:12px}
.kpi{border:1px solid var(--line);border-top:0;border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px;position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--violet)}
.kpi.g::before{background:var(--vert)} .kpi.warn::before{background:var(--warn)} .kpi.bad::before{background:var(--bad)}
.kpi.bad{background:var(--surface)}
.kpi .v{font-size:1.6rem;letter-spacing:-.02em}
.btn{border-radius:10px;min-height:40px;font-weight:600;box-shadow:0 1px 2px rgba(29,20,36,.04)}
.btn.primary{background:linear-gradient(180deg,#8a1496,#7a0a86);box-shadow:0 2px 8px rgba(122,10,134,.28)}
.btn.vert{box-shadow:0 2px 8px rgba(46,155,63,.25)}
.btn.ghost{box-shadow:none}
input[type=text],input[type=password],input[type=number],input[type=date],input[type=datetime-local],input[type=search],input[type=month],select,textarea{border-radius:10px;min-height:42px;background:var(--surface-2)}
input:focus,select:focus,textarea:focus{border-color:var(--violet);outline:none;box-shadow:0 0 0 3px var(--violet-soft)}
.tablewrap{border-radius:14px;box-shadow:var(--shadow)}
th{background:var(--surface-2)}
tbody tr:nth-child(even) td{background:color-mix(in srgb,var(--surface-2) 70%,transparent)}
.pill{padding:3px 10px;font-weight:600}
.alert{border-radius:12px;box-shadow:var(--shadow)}
.empty{border-radius:14px;background:var(--surface-2)}
.sheet{border-radius:22px 22px 0 0;box-shadow:var(--shadow-lg);padding:20px 18px calc(20px + env(safe-area-inset-bottom))}
.sheet::before{content:"";display:block;width:42px;height:5px;border-radius:3px;background:var(--line);margin:-8px auto 4px}
@media (min-width:720px){.sheet{border-radius:22px}.sheet::before{display:none}}
.toast{border-radius:14px;bottom:calc(86px + env(safe-area-inset-bottom))}

/* Navigation basse (téléphone) */
.overlay{z-index:40 !important}
.toast{z-index:50}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 4px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -4px 20px rgba(29,20,36,.06)}
.bnav a,.bnav button{display:grid;justify-items:center;gap:2px;padding:6px 2px;border:0;background:none;color:var(--muted);font-size:.68rem;font-weight:600;text-decoration:none;border-radius:12px;position:relative;cursor:pointer;min-width:0}
.bnav a span,.bnav button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bnav svg{width:23px;height:23px}
.bnav [aria-current="page"]{color:var(--violet)}
.bnav [aria-current="page"] svg{background:var(--violet-soft);border-radius:10px;padding:2px 10px;width:43px;box-sizing:border-box}
.bnav .nb{position:absolute;top:2px;left:calc(50% + 6px);min-width:17px;height:17px;border-radius:9px;background:#ff5a4e;color:#fff;font-size:.62rem;display:grid;place-items:center;padding:0 4px}
@media (max-width:899px){ nav.tabs{display:none} }
@media (min-width:900px){ .bnav{display:none} main{padding-bottom:60px} .toast{bottom:22px} }
body.tut .bnav [aria-current="page"]{color:var(--vert)}
body.tut .bnav [aria-current="page"] svg{background:var(--vert-soft)}
body.tut header.top{background:linear-gradient(120deg,#17662a,#1f7a2e 60%,#2e9b3f)}
body.tut header.top::after{background:linear-gradient(90deg,#7a0a86,#a33bb0,#7a0a86)}
.menu{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.menu a{display:grid;justify-items:center;gap:6px;padding:14px 6px;border:1px solid var(--line);border-radius:14px;text-decoration:none;color:var(--ink);font-size:.8rem;font-weight:600;text-align:center;background:var(--surface-2)}
.menu a svg{width:26px;height:26px;color:var(--violet)}
.menu a[aria-current="page"]{border-color:var(--violet);background:var(--violet-soft)}

/* Consignes */
.clist{display:grid;gap:10px}
.citem{display:grid;gap:6px;padding:14px;border:1px solid var(--line);border-left:4px solid var(--violet);border-radius:14px;background:var(--surface);box-shadow:var(--shadow);cursor:pointer;text-align:left;width:100%}
.citem.urg{border-left-color:var(--bad)} .citem.done{border-left-color:var(--vert);opacity:.85} .citem.late{border-left-color:var(--warn)}
.citem .t{font-weight:700;font-size:.95rem}
.citem .m{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:.78rem;color:var(--muted)}
.timeline{display:grid;gap:8px;border-left:2px solid var(--line);padding-left:14px;margin-left:4px}
.timeline div{position:relative;font-size:.86rem}
.timeline div::before{content:"";position:absolute;left:-20px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--line)}
.timeline div.on::before{background:var(--vert)}
.quote{background:var(--surface-2);border-radius:12px;padding:12px;white-space:pre-wrap;font-size:.9rem;border:1px solid var(--line)}

/* Évaluations et classement */
.btn svg{width:18px;height:18px;flex:none}
.elist{display:grid;gap:0}
.erow{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;padding:10px 4px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%;cursor:pointer;color:inherit}
.erow:last-child{border-bottom:0}
div.erow{cursor:default}
.erow.moi{background:var(--violet-soft);border-radius:12px}
.erow .rk{font-family:var(--display);font-weight:800;text-align:center;color:var(--muted)}
.erow .nm{display:grid;gap:1px;min-width:0}
.score{display:inline-grid;place-items:center;min-width:52px;height:30px;padding:0 8px;border-radius:10px;font-weight:800;font-family:var(--display);font-variant-numeric:tabular-nums}
.score.a{background:var(--ok-soft);color:var(--ok)} .score.b{background:var(--violet-soft);color:var(--violet)} .score.c{background:var(--warn-soft);color:var(--warn)} .score.d{background:var(--bad-soft);color:var(--bad)} .score.n{background:var(--surface-2);color:var(--muted)}
.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;align-items:end}
.podium div{display:grid;justify-items:center;gap:4px;padding:12px 6px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line);text-align:center;font-size:.82rem}
.podium .p1{background:linear-gradient(180deg,#fff7d6,var(--surface));border-color:#e9c84a;padding-top:20px}
.podium .rk{font-family:var(--display);font-weight:800;font-size:1.3rem}
.stars{display:flex;gap:6px;flex-wrap:wrap}
.stars label{border:1px solid var(--line);border-radius:10px;padding:6px 0;width:44px;text-align:center;font-weight:700;cursor:pointer;background:var(--surface-2)}
.stars label:has(input:checked){background:var(--violet);border-color:var(--violet);color:#fff}
.stars input{position:absolute;opacity:0;pointer-events:none}
.crit{display:grid;gap:6px;padding:10px 0;border-bottom:1px solid var(--line)}

/* Impression / PDF */
#print{display:none}
@media print{
  @page{size:A4;margin:14mm 12mm}
  body{background:#fff !important;color:#111 !important;font-size:10.5pt}
  body > *:not(#print){display:none !important}
  #print{display:block !important}
  .doc h1{font-family:var(--display);font-size:17pt;margin:0;color:#5a0763}
  .doc h2{font-size:12.5pt;margin:16px 0 6px;color:#5a0763;border-bottom:1.5px solid #2e9b3f;padding-bottom:3px;break-after:avoid}
  .doc h3{font-size:11pt;margin:10px 0 4px}
  .doc .hd{display:flex;align-items:center;gap:12px;border-bottom:3px solid #7a0a86;padding-bottom:10px;margin-bottom:6px}
  .doc .hd img{width:58px;height:58px;border-radius:50%}
  .doc .hd .org{font-size:9pt;color:#555;line-height:1.35}
  .doc .meta{display:flex;justify-content:space-between;font-size:9pt;color:#555;margin:6px 0 10px}
  .doc table{width:100%;border-collapse:collapse;font-size:9pt;margin:4px 0 8px;break-inside:auto}
  .doc th{background:#f3e8f5 !important;color:#3a0640;text-transform:none;letter-spacing:0;font-size:8.5pt;position:static;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .doc th,.doc td{border:1px solid #d9cfe0;padding:4px 6px;white-space:normal;text-align:left}
  .doc td.r,.doc th.r{text-align:right}
  .doc tr{break-inside:avoid}
  .doc tbody tr:nth-child(even) td{background:#faf7fb !important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .doc .kp{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:6px 0}
  .doc .kp div{border:1px solid #d9cfe0;border-left:3px solid #7a0a86;border-radius:6px;padding:6px 8px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .doc .kp b{display:block;font-size:13pt}
  .doc .kp span{font-size:8pt;color:#555}
  .doc .note{font-size:8.5pt;color:#555}
  .doc .sig{display:flex;justify-content:space-between;margin-top:28px;font-size:10pt}
  .doc .sig div{width:45%;border-top:1px solid #999;padding-top:4px;text-align:center}
  .doc .ft{margin-top:18px;font-size:8pt;color:#777;border-top:1px solid #ddd;padding-top:6px}
}
</style>
